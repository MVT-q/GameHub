<button type="button" (click)="toEditGame()">Edit</button>

@if (game) {
  <h1>{{ game.title }}</h1>

  <p>{{ game.releaseDate }}</p>

  <p>{{ game.description }}</p>

  <p>{{ getGenreLabel(game.genre) }}</p>

  <p>{{ game.updatedAt ?? '—' }}</p>

  @if (isInLibrary) {
    <button type="button" disabled>In library</button>
  } @else {
    <button type="button" [disabled]="isAddingToLibrary" (click)="addToLibrary()">
      {{ isAddingToLibrary ? 'Adding...' : 'Add to library' }}
    </button>
  }
}
