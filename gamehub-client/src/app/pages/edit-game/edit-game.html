<h1>Edit game info</h1>

<form (ngSubmit)="saveGame()">
  <label for="title">Title: </label>
  <input type="text" id="title" name="title" [(ngModel)]="gameTitle" />
  
  <label for="releaseDate">Release date: </label>
  <input type="date" id="releaseDate" name="releaseDate" [(ngModel)]="gameReleaseDate" />
  
  <label for="description">Description: </label>
  <input type="text" id="description" name="description" [(ngModel)]="gameDescription" />
  
  <label for="dedicatedServers">Has dedicated servers: </label>
  <input type="checkbox" id="dedicatedServers" name="dedicatedServers" [(ngModel)]="hasDedicatedServers" />
  
  <label for="genre">Game genre: </label>
  <select id="genre" name="genre" [(ngModel)]="gameGenre">
    @for (genre of genres; track genre.value) {
      <option [ngValue]="genre.value">
        {{ genre.label }}
      </option>
    }
  </select>
  
  <button type="submit">Save</button>
</form>
