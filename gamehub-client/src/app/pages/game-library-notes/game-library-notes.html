<h3>Notes</h3>

<button type="button" (click)="toggleNotes()">{{ noteButtonText }}</button>

@if (showNotes) {
  <button type="button" (click)="startCreate()">Create note</button>

  @if (isCreating) {
    <form (ngSubmit)="createNote()">
      <label for="title">Title: </label>
      <input type="text" id="title" name="title" [(ngModel)]="noteTitle" required />

      <label for="description">Description: </label>
      <input type="text" id="description" name="description" [(ngModel)]="noteDescription" />

      <button type="submit">Create</button>
    </form>
  }

  <br />

  <form (ngSubmit)="onSearch()">
    <input type="text" id="search" name="search" [(ngModel)]="search" />

    <select id="sortByCreateDate" name="sortByCreateDate" [(ngModel)]="sortByCreateDate">
      <option [ngValue]="true">From new to old</option>
      <option [ngValue]="false">From old to new</option>
    </select>

    <button type="submit">Search</button>
  </form>

  @if (notes.length > 0) {
    @for (note of notes; track note.id) {
      <p>{{ note.title }}</p>
      <p>{{ note.description }}</p>
      <p>{{ note.createdAt }}</p>
      <button type="button" (click)="deleteNote(note.id)">Delete</button>
      <button type="button" (click)="editNote(note)">Edit</button>

      @if (editingNoteId === note.id) {
        <input type="text" [(ngModel)]="editingNoteTitle" required />
        <input type="text" [(ngModel)]="editingNoteDescription" />

        <button type="button" (click)="updateNote(note.id)">Save</button>
        <button type="button" (click)="cancelEdit()">Cancel</button>
      }
    }
  } @else {
    <p>No notes found</p>
  }

  <br />

  <button type="button" [disabled]="currentPage === 1" (click)="previousPage()">Previous</button>

  <span>Page {{ currentPage }} of {{ totalPages }}</span>

  <button type="button" [disabled]="currentPage >= totalPages" (click)="nextPage()">Next</button>
}
